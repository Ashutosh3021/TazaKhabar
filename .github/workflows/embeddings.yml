name: embeddings

# Daily embedding backfill. Heavy (torch), so it runs once a day on its own
# schedule instead of with every scrape.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: embeddings
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill content embeddings
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.embeddings.txt

      - name: Cache the sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: minilm-l6-v2

      - name: Install dependencies
        run: pip install -r requirements.embeddings.txt

      - name: Backfill embeddings
        env:
          PYRONITES_URL: ${{ secrets.PYRONITES_URL }}
          PYRONITES_KEY: ${{ secrets.PYRONITES_KEY }}
          PYRONITES_PROJECT_ID: ${{ secrets.PYRONITES_PROJECT_ID }}
        run: python -m src.cli ci-embeddings
