name: scrape

# The scrapers run here, not on Render: the API service stays stateless and
# the Render disk is never used for scraped data.
#
# Triggers:
#   push to main  - a fresh run right after every deploy
#   every 2 hours - the steady cadence
#   manual        - on demand
#
# The scheduler in GitHub Actions is best effort and can silently skip a slot,
# so scrape-fallback.yml watches this workflow and dispatches a run when one
# has not happened for two hours.
run-name: scrape (${{ github.event_name }})

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape HN and refresh trends
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.ci.txt

      - name: Install dependencies
        run: pip install -r requirements.ci.txt

      - name: Check Pyronites connection
        env:
          PYRONITES_URL: ${{ secrets.PYRONITES_URL }}
          PYRONITES_KEY: ${{ secrets.PYRONITES_KEY }}
          PYRONITES_PROJECT_ID: ${{ secrets.PYRONITES_PROJECT_ID }}
        run: python -m src.cli check-pyronites

      - name: Scrape and summarize
        env:
          PYRONITES_URL: ${{ secrets.PYRONITES_URL }}
          PYRONITES_KEY: ${{ secrets.PYRONITES_KEY }}
          PYRONITES_PROJECT_ID: ${{ secrets.PYRONITES_PROJECT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m src.cli ci-run
