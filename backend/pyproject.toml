[project]
name = "tazakhabar-backend"
version = "2.0.0"
description = "Backend API for TazaKhabar, backed by Pyronites"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.27.1",
    "hypercorn==0.16.0",
    "httpx>=0.28.1,<1.0.0",
    "beautifulsoup4==4.12.3",
    "lxml==5.1.0",
    "python-dotenv==1.0.1",
    "pydantic>=2.11.2,<3.0.0",
    "pydantic-settings==2.3.0",
    "python-multipart==0.0.9",
    "tenacity==8.2.3",
    "google-genai==1.67.0",
    "openrouter==0.7.11",
    "groq==0.14.0",
    "pymupdf==1.26.7",
    "scikit-learn==1.4.0",
    "numpy>=1.26,<2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
