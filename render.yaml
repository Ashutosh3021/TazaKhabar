services:
  - type: web
    name: tazakhabar-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.render.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LOG_LEVEL
        value: INFO
      # Embeddings are produced by the GitHub Actions workflow; the API only
      # reads them from Pyronites, so no torch on the Render instance.
      - key: EMBEDDINGS_ENABLED
        value: "false"
      # Pyronites (PyroCore): auth, tables and file storage.
      - key: PYRONITES_URL
        sync: false
      - key: PYRONITES_KEY
        sync: false
      - key: PYRONITES_PROJECT_ID
        value: tazakhabar
      # Session cookie signing secret (any long random string).
      - key: AUTH_SESSION_SECRET
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: "none"
      # Exact frontend origin, no wildcards.
      - key: ALLOWED_ORIGINS
        sync: false
      # Guards the write endpoints (scrape trigger, CSV load, backfill).
      - key: ADMIN_TOKEN
        sync: false
      # LLM keys for the interactive endpoints (resume analysis, career bot).
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
